[project]
name = "conversion"
version = "0.1.0"
dependencies = [
    "requests",
    "numpy",
    "pandas",
    "h5py",
    "scipy",
    "tqdm",
    "duckdb",
    "boto3",
    "s3fs",
    "python-dotenv",
    "pyarrow",
]
requires-python = ">=3.8"


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]
