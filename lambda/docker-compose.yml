services:
  minio:
    image: minio/minio
    container_name: stormsim-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc
    container_name: stormsim-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../data:/local-data
    entrypoint: >
      /bin/sh -c "
      mc alias set local_minio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local_minio/stormsim;
      mc cp -r /local-data/ local_minio/stormsim/data/;
      exit 0;
      "

  lcgen-lambda:
    build:
      context: ..
      dockerfile: lambda/lcgen/Dockerfile
    container_name: stormsim-lcgen-lambda
    ports:
      - "8081:8080"
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
